<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRUD LocalStorage - Tailwind</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-50 p-5 md:p-10 font-sans text-slate-800">
    <div
      class="max-w-2xl mx-auto bg-white p-6 rounded-xl shadow-lg border border-slate-200"
    >
      <h2 class="text-3xl font-extrabold mb-6 text-indigo-600 tracking-tight">
        Daftar Belanja
      </h2>

      <form id="crudForm" class="space-y-4 mb-10">
        <div class="flex flex-col gap-2">
          <label for="taskInput" class="text-sm font-semibold text-slate-600"
            >Nama Barang</label
          >
          <div class="flex gap-2">
            <input type="hidden" id="editIndex" />
            <input
              type="text"
              id="taskInput"
              placeholder="Contoh: Susu Segar..."
              class="flex-1 p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none transition"
              required
            />

            <button
              type="submit"
              id="submitBtn"
              class="bg-indigo-600 text-white px-6 py-3 rounded-lg font-bold hover:bg-indigo-700 active:scale-95 transition-all"
            >
              Simpan
            </button>
          </div>
          <button
            type="button"
            id="cancelBtn"
            onclick="resetForm()"
            class="hidden text-sm text-slate-500 hover:text-red-500 underline text-left w-fit"
          >
            Batal Edit
          </button>
        </div>
      </form>

      <div class="space-y-3" id="taskList"></div>

      <div id="emptyState" class="hidden text-center py-10 text-slate-400">
        <p>Belum ada data. Silakan tambah barang baru!</p>
      </div>
    </div>

    <script>
      const form = document.getElementById("crudForm");
      const taskInput = document.getElementById("taskInput");
      const editIndexInput = document.getElementById("editIndex");
      const submitBtn = document.getElementById("submitBtn");
      const cancelBtn = document.getElementById("cancelBtn");
      const taskList = document.getElementById("taskList");
      const emptyState = document.getElementById("emptyState");

      // --- LOGIKA UTAMA ---

      // 1. Ambil data dari LocalStorage (Ganti dari sessionStorage)
      let tasks = JSON.parse(localStorage.getItem("my_crud_data")) || [];

      function renderTasks() {
        taskList.innerHTML = "";

        if (tasks.length === 0) {
          emptyState.classList.remove("hidden");
        } else {
          emptyState.classList.add("hidden");
          tasks.forEach((task, index) => {
            const item = document.createElement("div");
            item.className =
              "flex items-center justify-between p-4 bg-slate-50 rounded-lg border border-slate-100 hover:border-indigo-200 transition";
            item.innerHTML = `
                        <span class="font-medium text-slate-700">${task}</span>
                        <div class="flex gap-4">
                            <button onclick="editTask(${index})" class="text-indigo-600 hover:text-indigo-800 font-semibold text-sm">Edit</button>
                            <button onclick="deleteTask(${index})" class="text-red-500 hover:text-red-700 font-semibold text-sm">Hapus</button>
                        </div>
                    `;
            taskList.appendChild(item);
          });
        }

        // Simpan ke LocalStorage setiap ada perubahan
        localStorage.setItem("my_crud_data", JSON.stringify(tasks));
      }

      // 2. Tambah / Simpan
      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const val = taskInput.value.trim();
        const idx = editIndexInput.value;

        if (idx === "") {
          tasks.push(val);
        } else {
          tasks[idx] = val;
        }

        resetForm();
        renderTasks();
      });

      // 3. Hapus
      function deleteTask(index) {
        if (confirm("Hapus item ini?")) {
          tasks.splice(index, 1);
          renderTasks();
        }
      }

      // 4. Edit mode
      function editTask(index) {
        taskInput.value = tasks[index];
        editIndexInput.value = index;
        submitBtn.innerText = "Update";
        submitBtn.classList.replace("bg-indigo-600", "bg-emerald-600");
        cancelBtn.classList.remove("hidden");
        taskInput.focus();
      }

      // 5. Reset Form
      function resetForm() {
        form.reset();
        editIndexInput.value = "";
        submitBtn.innerText = "Simpan";
        submitBtn.classList.replace("bg-emerald-600", "bg-indigo-600");
        cancelBtn.classList.add("hidden");
      }

      // Jalankan saat pertama kali dibuka
      renderTasks();
    </script>
  </body>
</html>
